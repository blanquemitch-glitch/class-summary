<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e6e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>课堂总结</title>
<style>
:root{--bg:#f2f5f7;--surface:#fff;--ink:#17232f;--muted:#5d6b78;--line:#d9e0e6;--accent:#0b6e6e;--accent-ink:#fff;--mark:#fff1a8;--danger:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--surface:#18222b;--ink:#e8eef3;--muted:#9aa9b6;--line:#2a3743;--accent:#4fc1b8;--accent-ink:#06201e;--mark:#4a4216;--danger:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171d;--surface:#18222b;--ink:#e8eef3;--muted:#9aa9b6;--line:#2a3743;--accent:#4fc1b8;--accent-ink:#06201e;--mark:#4a4216;--danger:#ff8a80;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
h1 span{background:linear-gradient(transparent 58%,var(--mark) 58%)}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:10px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--muted)}
.row>label{flex:1;min-width:0}
input,textarea{width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
textarea{min-height:170px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.primary{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.primary:disabled{opacity:.55;cursor:default}
.msg{margin:10px 0 0;font-size:.9rem;color:var(--muted)}
.msg.err{color:var(--danger)}
#out{margin-top:16px;white-space:pre-wrap;word-break:break-word}
#out:empty{display:none}
h2{font-size:1.1rem;margin:28px 0 10px}
.day{font-size:.85rem;color:var(--muted);margin:18px 0 6px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:0 14px}
summary{padding:12px 0;cursor:pointer;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word;padding-bottom:12px}
.raw{margin:0 0 12px;border-radius:8px;background:var(--bg)}
.raw summary{font-weight:400;font-size:.9rem;color:var(--muted)}
.del{border:0;background:none;color:var(--danger);padding:0 0 12px;font-size:.9rem}
.empty,.note{color:var(--muted);font-size:.85rem}
.note{margin-top:24px}
.code{margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
<h1><span>课堂总结</span></h1>
<p class="sub">粘贴今天的课堂笔记，自动整理出重点、要记的概念和作业。</p>

<section class="card">
<div class="row">
<label>日期<input type="date" id="date"></label>
<label>课程<input type="text" id="course" placeholder="例如：高等数学"></label>
</div>
<label>课堂内容<textarea id="notes" placeholder="把笔记或录音转出来的文字粘贴到这里"></textarea></label>
<label class="code">访问口令（部署时你自己设置的，只需填一次）<input type="password" id="code" autocomplete="off"></label>
<button class="primary" id="go">生成总结</button>
<p class="msg" id="msg" role="status"></p>
<div id="out"></div>
</section>

<h2>历史记录</h2>
<div id="hist"></div>
<p class="note">记录只保存在当前设备的这个浏览器里，换设备或清除浏览数据后不会保留。</p>
</main>

<script>
(function(){
var KEY="classlog:v1",CODE="classlog:code",entries=[];
var $=function(id){return document.getElementById(id)};
function today(){var d=new Date(),p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function load(){try{var r=localStorage.getItem(KEY);entries=r?JSON.parse(r):[]}catch(e){entries=[]}if(!Array.isArray(entries))entries=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch(e){return false}}
function msg(t,err){var m=$("msg");m.textContent=t||"";m.className="msg"+(err?" err":"")}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

function render(){
  var box=$("hist");box.textContent="";
  if(!entries.length){box.appendChild(el("p","empty","还没有记录。粘贴课堂内容，点“生成总结”，结果会自动保存在这里。"));return}
  var sorted=entries.slice().sort(function(a,b){return a.date===b.date?b.id-a.id:(a.date<b.date?1:-1)});
  var last="";
  sorted.forEach(function(e){
    if(e.date!==last){box.appendChild(el("div","day",e.date));last=e.date}
